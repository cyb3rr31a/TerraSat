# ---------------------------------------------------------------------------
# Audit profile: Urban Flood Exposure & Drainage Watch  (DEMO CASE STUDY)
# A profile tells the TerraSat engine what to look for in the imagery (SAM
# prompts), which map layers to load, which spatial rules to apply and how to
# write the memo. New use cases = new profile files, not new code.
# ---------------------------------------------------------------------------
id: flood
name: Urban Flood Exposure & Drainage Watch
tagline: Who is exposed, where will water back up, and what are residents seeing?
status: case_study          # case_study | beta | planned
audience: Ward disaster officers, Nairobi County, Kenya Red Cross

audit:
  side_m: 2100              # square analysed around the pin
  zoom: 18                  # ~0.6 m/px

# Live tests on Mathare (Oct 28): "building" found the most roofs (95 vs 13 for
# "rooftop"), but no prompt found the dense informal roofs, even at zoom 19, so
# the buildings_baseline layer fills those gaps. No prompt found drains, rivers
# or garbage from above: waterways come from OpenStreetMap; garbage comes from
# citizen reports (kept here in case a better prompt turns up).
classes:                    # one short noun phrase per SAM prompt
  building: {prompts: [building], color: "#00E5FF", min_area_m2: 6, max_area_m2: 5000}
  garbage:  {prompts: [garbage], color: "#FF3D00", min_area_m2: 4, max_area_m2: 20000}

layers: [osm_waterways, osm_roads, buildings_baseline, unosat_2024, copernicus_dem, flood_history]

analyzer: flood_exposure
params:
  riparian_buffer_m: 30     # configurable; reported legal range 6-30 m - cite source
  persons_per_structure: null
  # Flood risk per building. Tuned on UNOSAT's 2024 damage at Mukuru, checked on
  # holdout sites (Korogocho, east Nairobi) - results in docs/SPEC.md.
  # The 2024 flood extent is not an input, so it can still check the score.
  risk_rules:
    high:   [{within_m: 30}, {within_m: 60, below_m: 1}]    # metres from / above the river
    medium: [{within_m: 60}, {within_m: 100, below_m: 3}]
  channel_min_ha: 200       # drainage lines from the DEM: at least this much land drains through...
  channel_fallback_m: 500   # ...used where no mapped river is within this distance
  low_lying_m: 3            # for the terrain summary
  dip_depth_m: 0.5          # surface-water flag: water would pond at least this deep...
  flow_path_min_ha: 5       # ...or at least this much land drains through the spot
  # Drainage choke points: where water must pass under a road (culvert or bridge).
  # Ranked by land draining through, at-risk buildings nearby and residents' reports.
  choke_points:
    min_upstream_ha: 20     # flow paths smaller than this are ignored
    merge_m: 60             # candidates closer than this are one place
    near_m: 150             # buildings and reports counted within this distance
    weights: {upstream: 0.4, buildings: 0.3, reports: 0.3}   # 3 reports of a blockage beat a big but quiet crossing

memo:
  framing: >-
    Protection, not enforcement. Recommend which drains and crossings to clear
    before the peak rains and where to warn and evacuate first. Never frame
    structures as targets for demolition or eviction.
  sections: [Risk summary, This week's rain outlook, Drains and crossings to clear first,
             Where to warn and evacuate first, What residents are reporting, Data limits]
  languages: [en, sw]

# What people can report for this use case (Muse Spark sorts each voice note into
# one of these) and the quick questions the chat asks people standing at a place,
# which build a street-level flood history no satellite can see.
reports:
  corroborate: true           # checked against river distance, height and the 2024 flood
  types:
    flooding:           [Flooding, Mafuriko]
    standing_water:     [Water that stays for days, Maji yanayokaa kwa siku]
    blocked_drain:      [Blocked drain, Mtaro umeziba]
    river_overflow:     [River overflow, Mto umefurika]
    road_impassable:    [Road impassable in rain, Barabara haipitiki mvua ikinyesha]
    collapsed_bridge:   [Collapsed bridge or culvert, Daraja au kalvati limeanguka]
    garbage:            [Garbage or dumping, Taka au utupaji]
    riverbank_building: [New building near a river, Ujenzi mpya karibu na mto]
    ground_cracks:      ["Cracks, erosion or sinking ground", "Nyufa, mmomonyoko au ardhi kuzama"]

questions:
  - id: flooded_last_season
    en: Did this street flood in the last rainy season?
    sw: Je, mtaa huu ulifurika msimu wa mvua uliopita?
    options:
      "no":  ["No", Hapana]
      ankle: [Ankle deep, Hadi kifundo cha mguu]
      knee:  [Knee deep, Hadi goti]
      waist: [Waist deep or more, Hadi kiuno au zaidi]
  - id: water_stays
    en: After heavy rain, how long does water stay here?
    sw: Baada ya mvua kubwa, maji hukaa hapa kwa muda gani?
    options:
      none:  [It drains quickly, Hukauka haraka]
      hours: [A few hours, Saa chache]
      days:  [A day or more, Siku moja au zaidi]
  - id: road_passable
    en: Can cars use the roads here when it rains heavily?
    sw: Je, magari hupita barabara za hapa mvua kubwa ikinyesha?
    options:
      "yes":     ["Yes", Ndiyo]
      sometimes: [Sometimes, Wakati mwingine]
      "no":      ["No", Hapana]
